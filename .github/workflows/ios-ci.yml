name: iOS CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-and-test:
    name: Build and test
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Select available iPhone simulator
        run: |
          set -euo pipefail
          SIMULATOR_NAME="$(xcrun simctl list devices available | awk -F '[()]' '/iPhone/ { gsub(/^[ \t]+|[ \t]+$/, "", $1); print $1; exit }')"
          if [ -z "$SIMULATOR_NAME" ]; then
            echo "No available iPhone simulator found."
            xcrun simctl list devices available
            exit 1
          fi
          echo "SIMULATOR_NAME=$SIMULATOR_NAME" >> "$GITHUB_ENV"
          echo "Selected simulator: $SIMULATOR_NAME"

      - name: Resolve Swift packages
        run: |
          xcodebuild -resolvePackageDependencies \
            -project AnkiOpen.xcodeproj \
            -scheme AnkiOpen

      - name: Build
        run: |
          xcodebuild build \
            -project AnkiOpen.xcodeproj \
            -scheme AnkiOpen \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

      - name: Test
        run: |
          xcodebuild test \
            -project AnkiOpen.xcodeproj \
            -scheme AnkiOpen \
            -destination "platform=iOS Simulator,name=$SIMULATOR_NAME" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO
